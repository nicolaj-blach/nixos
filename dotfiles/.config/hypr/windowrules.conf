# See https://wiki.hypr.land/Configuring/Window-Rules/

# AGS bar - blur background
layerrule = blur, bar
layerrule = ignorealpha 0.3, bar

# Ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Floating TUIs - centered
windowrule = float, title:^tui-float$
windowrule = size 60% 70%, title:^tui-float$
windowrule = center, title:^tui-float$

# Screensaver - fullscreen, no decorations
windowrule = fullscreen, title:^screensaver$
windowrule = noanim, title:^screensaver$

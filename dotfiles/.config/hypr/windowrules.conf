# See https://wiki.hypr.land/Configuring/Window-Rules/

# AGS bar - blur background
layerrule = blur on, match:namespace bar
layerrule = ignore_alpha 0.3, match:namespace bar

# Ignore maximize requests from apps
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# Floating terminals - centered
windowrule = match:title ^terminal-float$, float on
windowrule = match:title ^terminal-float$, size 800 500
windowrule = match:title ^terminal-float$, center on

# Floating terminals - large
windowrule = match:title ^terminal-float-large$, float on
windowrule = match:title ^terminal-float-large$, size 1400 900
windowrule = match:title ^terminal-float-large$, center on

# Screensaver - fullscreen, no decorations
windowrule = match:title ^screensaver$, fullscreen on
windowrule = match:title ^screensaver$, no_anim on

# Gaming optimizations - disable blur/transparency, enable tearing for Steam games
windowrule = match:class ^steam_app_.*$, immediate on
windowrule = match:class ^steam_app_.*$, opaque on
windowrule = match:class ^steam_app_.*$, no_blur on
windowrule = match:class ^steam_app_.*$, fullscreen on

# Notes special workspace - launch nvim on first open
workspace = special:notes, on-created-empty:$terminal --directory $HOME/notes -e nvim

# See https://wiki.hypr.land/Configuring/Window-Rules/

# Ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Pinned clipboard image - float, pin on top, no border
windowrule = float, class:^imv$, title:^pinned-image
windowrule = pin, class:^imv$, title:^pinned-image
windowrule = size 30% 30%, class:^imv$, title:^pinned-image
windowrule = move 68% 2%, class:^imv$, title:^pinned-image
windowrule = noborder, class:^imv$, title:^pinned-image

# Yazi file picker - float and center
windowrule = float, title:^File Picker$
windowrule = size 60% 70%, title:^File Picker$
windowrule = center, title:^File Picker$

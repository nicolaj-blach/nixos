# See https://wiki.hypr.land/Configuring/Window-Rules/

# Ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Background apps - move to special workspace on launch
windowrule = workspace special:background silent, class:^(proton-mail)$

# Floating TUIs - centered
windowrule = float, title:^tui-float$
windowrule = size 60% 70%, title:^tui-float$
windowrule = center, title:^tui-float$

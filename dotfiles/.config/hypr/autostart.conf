exec-once = hyprlock-wrapper
exec-once = udiskie --automount --notify
exec-once = swayosd-server
exec-once = mako
exec-once = ~/.local/bin/clipboard-notify
exec-once = walker --gapplication-service
exec-once = elephant
exec-once = swww-daemon
exec-once = sleep 1 && ~/.config/hypr/scripts/random-wallpaper.sh
exec-once = tinty sync && tinty init
exec-once = while true; do top-bar; sleep 1; done
exec-once = vesktop --start-minimized
# Start GPG agent early
exec-once = gpg-connect-agent /bye
exec-once = hyprctl dispatch -- exec [workspace special:mail silent] ghostty -e aerc-wrapper

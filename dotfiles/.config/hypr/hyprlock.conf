# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Modern TUI-style lock screen

source = ~/.config/hypr/hyprlock-colors.conf

general {
    grace = 0
    no_fade_in = true
    no_fade_out = true
    immediate_render = true
    hide_cursor = true
    fail_timeout = 10000
}

auth {
    fingerprint {
        enabled = true
        ready_message = scan fingerprint to unlock
        present_message = scanning...
    }
}

# Blurred screenshot of current desktop
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.01
    brightness = 0.8
}

# Main panel -- sharp corners, single-line border
shape {
    monitor =
    size = 1200, 460
    color = $lock_bg
    rounding = 0
    border_size = 1
    border_color = $lock_border
    position = 0, 0
    halign = center
    valign = center
}

# Title bar text
label {
    monitor =
    text = [ locked ]
    color = $lock_accent
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 205
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M:%S'
    color = $lock_fg
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %d'
    color = $lock_muted
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Separator
shape {
    monitor =
    size = 1120, 1
    color = $lock_border
    rounding = 0
    border_size = 0
    position = 0, -10
    halign = center
    valign = center
}

# Password prompt label
label {
    monitor =
    text = password >
    color = $lock_muted
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -460, -80
    halign = center
    valign = center
}

# Input field border -- sharp corners
shape {
    monitor =
    size = 910, 60
    color = $lock_bg_transparent
    rounding = 0
    border_size = 1
    border_color = $lock_border
    position = 85, -80
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 890, 50
    outline_thickness = 0
    dots_size = 0.4
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 0
    dots_text_format = *
    outer_color = rgba(00000000)
    inner_color = $lock_bg_transparent
    font_color = $lock_red
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 0
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    fail_text =
    fail_transition = 0
    dots_fade_time = 0
    fade_timeout = 0
    position = 85, -80
    halign = center
    valign = center
}

# Failed attempts (persistent, only shows after failure)
label {
    monitor =
    text = cmd[update:500] [ $ATTEMPTS -gt 0 ] && echo "$ATTEMPTS failed attempts"
    color = $lock_red
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}

# Status line
label {
    monitor =
    text = cmd[update:1000] echo "$(whoami)@$(hostname)"
    color = $lock_border
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -195
    halign = center
    valign = center
}

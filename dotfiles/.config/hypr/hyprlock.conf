# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Modern TUI-style lock screen

general {
    grace = 0
    no_fade_in = true
    no_fade_out = true
    immediate_render = true
    hide_cursor = true
}

# Blurred screenshot of current desktop
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.01
    brightness = 0.8
}

# Main panel -- sharp corners, single-line border
shape {
    monitor =
    size = 1200, 460
    color = rgba(282c34ee)
    rounding = 0
    border_size = 1
    border_color = rgb(4b5263)
    position = 0, 0
    halign = center
    valign = center
}

# Title bar text
label {
    monitor =
    text = [ locked ]
    color = rgb(c678dd)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 205
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M:%S'
    color = rgb(abb2bf)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %d'
    color = rgb(5c6370)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Separator
shape {
    monitor =
    size = 1120, 1
    color = rgb(4b5263)
    rounding = 0
    border_size = 0
    position = 0, -10
    halign = center
    valign = center
}

# Password prompt label
label {
    monitor =
    text = password >
    color = rgb(5c6370)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -460, -80
    halign = center
    valign = center
}

# Input field border -- sharp corners
shape {
    monitor =
    size = 910, 60
    color = rgba(1e222800)
    rounding = 0
    border_size = 1
    border_color = rgb(4b5263)
    position = 85, -80
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 890, 50
    outline_thickness = 0
    dots_size = 0.4
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 0
    dots_text_format = *
    outer_color = rgba(00000000)
    inner_color = rgba(1e222800)
    font_color = rgb(e06c75)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 0
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    fail_text = <span font_family="JetBrainsMono Nerd Font" font_size="16pt" foreground="##e06c75">error: authentication failed ($ATTEMPTS)</span>
    fail_timeout = 2000
    fail_transition = 0
    dots_fade_time = 0
    fade_timeout = 0
    position = 85, -80
    halign = center
    valign = center
}

# Status line
label {
    monitor =
    text = cmd[update:1000] echo "$(whoami)@$(hostname)"
    color = rgb(4b5263)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -195
    halign = center
    valign = center
}

# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Modern TUI lock screen

general {
    grace = 0
    no_fade_in = true
    no_fade_out = true
    immediate_render = true
    hide_cursor = true
}

# Blurred screenshot of current desktop
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.01
    brightness = 0.8
}

# Main panel
shape {
    monitor =
    size = 1200, 500
    color = rgba(282c34cc)
    rounding = 16
    border_size = 1
    border_color = rgb(4b5263)
    position = 0, 0
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgb(c678dd)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %d'
    color = rgb(4b5263)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# Separator
shape {
    monitor =
    size = 1080, 1
    color = rgb(4b5263)
    rounding = 0
    border_size = 0
    position = 0, -30
    halign = center
    valign = center
}

# Input field border
shape {
    monitor =
    size = 1080, 70
    color = rgba(1e222800)
    rounding = 10
    border_size = 1
    border_color = rgb(4b5263)
    position = 0, -110
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 1060, 60
    outline_thickness = 0
    dots_size = 0.15
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 3
    outer_color = rgba(00000000)
    inner_color = rgba(1e222800)
    font_color = rgb(abb2bf)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 8
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    fail_text =
    fail_timeout = 0
    fail_transition = 0
    dots_fade_time = 0
    fade_timeout = 0
    position = 0, -110
    halign = center
    valign = center
}

# See https://wiki.hypr.land/Configuring/Monitors/
# Layout: AOC (left) | Lenovo ultrawide (center) | Samsung vertical (right)

# AOC 24G2WG3 - Left monitor, bottom-aligned with ultrawide
# Ultrawide is 1440px tall, AOC is 1080px tall, so y-offset = 1440 - 1080 = 360
monitor = HDMI-A-1, 1920x1080@144, 0x360, 1

# Lenovo G34w-10 - Center ultrawide (primary)
# Positioned after AOC (1920px wide)
# Note: 144Hz caused display issues, using 60Hz for stability
monitor = DP-1, 3440x1440@60, 1920x0, 1

# Samsung SMS22A450 - Right monitor, rotated 90° (counter-clockwise)
# After rotation: 1050x1680, positioned after ultrawide (1920 + 3440 = 5360)
# Almost top-aligned with ultrawide (small offset for alignment)
monitor = DP-2, 1680x1050@60, 5360x0, 1, transform, 1

# Fallback for any other monitors
monitor = , preferred, auto, 1

# Workspace assignments - each monitor gets its own set of 9 workspaces
# Left (AOC): 11-19
# Center (Lenovo): 1-9 (default)
# Right (Samsung): 21-29
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1

workspace = 11, monitor:HDMI-A-1, default:true
workspace = 12, monitor:HDMI-A-1
workspace = 13, monitor:HDMI-A-1
workspace = 14, monitor:HDMI-A-1
workspace = 15, monitor:HDMI-A-1
workspace = 16, monitor:HDMI-A-1
workspace = 17, monitor:HDMI-A-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:HDMI-A-1

workspace = 21, monitor:DP-2, default:true
workspace = 22, monitor:DP-2
workspace = 23, monitor:DP-2
workspace = 24, monitor:DP-2
workspace = 25, monitor:DP-2
workspace = 26, monitor:DP-2
workspace = 27, monitor:DP-2
workspace = 28, monitor:DP-2
workspace = 29, monitor:DP-2

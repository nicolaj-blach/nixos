# See https://wiki.hypr.land/Configuring/Monitors/
# Layout: AOC (left) | Lenovo ultrawide (center) | Samsung vertical (right)
# Using desc: matching for stable monitor identification across port changes

# AOC 24G2WG3 - Left monitor, bottom-aligned with ultrawide
# Ultrawide is 1440px tall, AOC is 1080px tall, so y-offset = 1440 - 1080 = 360
monitor = desc:AOC 24G2WG3-, 1920x1080@144, 0x360, 1

# Lenovo G34w-10 - Center ultrawide (primary)
# Positioned after AOC (1920px wide)
# Note: 144Hz caused display issues, using 60Hz for stability
monitor = desc:Lenovo Group Limited LEN G34w-10, 3440x1440@60, 1920x0, 1

# Samsung SMS22A450 - Right monitor, rotated 90° (counter-clockwise)
# After rotation: 1050x1680, positioned directly after ultrawide (1920 + 3440 = 5360)
# Top-aligned with ultrawide
monitor = desc:Samsung Electric Company SMS22A450, 1680x1050@60, 5360x0, 1, transform, 1

# Fallback for any other monitors (laptop, etc.)
monitor = , preferred, auto, 1

# Workspaces are dynamically allocated based on monitor index:
# Monitor 0: workspaces 1-9, Monitor 1: 11-19, Monitor 2: 21-29
# Handled by workspace.sh script and AGS bar

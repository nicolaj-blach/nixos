# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER

# Launch programs
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, F, exec, $terminal --title=tui-float --shell-integration-features=no-title -e ~/.local/bin/yazi-picker
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, vesktop
bind = $mainMod SHIFT, E, exec, $terminal -e aerc
bind = $mainMod, X, exec, ghostty --title=screensaver --cursor-opacity=0 -e screensaver
bind = $mainMod SHIFT, X, exec, hyprlock-wrapper

# Power menu
bind = $mainMod, ESCAPE, exec, power-menu

# Walker providers
bind = $mainMod SHIFT, SPACE, exec, walker -m clipboard
bind = $mainMod, SLASH, exec, walker -m websearch
bind = $mainMod, C, exec, walker -m calc
bind = $mainMod, E, exec, walker -m symbols
bind = $mainMod SHIFT, T, exec, walker -m todo

# Floating TUIs
bind = $mainMod SHIFT, W, exec, ~/.local/bin/tui-wifi
bind = $mainMod SHIFT, B, exec, ~/.local/bin/tui-bluetooth
bind = $mainMod SHIFT, A, exec, ~/.local/bin/tui-audio

# Window management
bind = $mainMod, W, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, exec, project-menu
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/pin-image.sh
bind = $mainMod, F, fullscreen, 0
# togglesplit was removed in newer Hyprland - use layoutmsg instead
bind = $mainMod, T, layoutmsg, togglesplit

# Move focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d 

# Workspaces - handled by split-monitor-workspaces plugin
# Each monitor has independent workspaces 1-9
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9

# Move window to workspace on current monitor (and follow)
bind = $mainMod SHIFT, 1, split-movetoworkspace, 1
bind = $mainMod SHIFT, 2, split-movetoworkspace, 2
bind = $mainMod SHIFT, 3, split-movetoworkspace, 3
bind = $mainMod SHIFT, 4, split-movetoworkspace, 4
bind = $mainMod SHIFT, 5, split-movetoworkspace, 5
bind = $mainMod SHIFT, 6, split-movetoworkspace, 6
bind = $mainMod SHIFT, 7, split-movetoworkspace, 7
bind = $mainMod SHIFT, 8, split-movetoworkspace, 8
bind = $mainMod SHIFT, 9, split-movetoworkspace, 9

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through workspaces on current monitor
bind = $mainMod, mouse_down, split-workspace, +1
bind = $mainMod, mouse_up, split-workspace, -1

# Mouse bindings for moving/resizing
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Monitor focus (next/prev based on monitor ID, swap direction to match physical layout)
bind = $mainMod CTRL, H, focusmonitor, +1
bind = $mainMod CTRL, L, focusmonitor, -1

# Move window to monitor (next/prev)
bind = $mainMod CTRL SHIFT, H, movewindow, mon:+1
bind = $mainMod CTRL SHIFT, L, movewindow, mon:-1

# Focus specific monitor (1=left, 2=center, 3=right)
bind = $mainMod CTRL, 1, focusmonitor, desc:AOC 24G2WG3-
bind = $mainMod CTRL, 2, focusmonitor, desc:Lenovo Group Limited LEN G34w-10
bind = $mainMod CTRL, 3, focusmonitor, desc:Samsung Electric Company SMS22A450

# Move window to specific monitor
bind = $mainMod CTRL SHIFT, 1, movewindow, mon:desc:AOC 24G2WG3-
bind = $mainMod CTRL SHIFT, 2, movewindow, mon:desc:Lenovo Group Limited LEN G34w-10
bind = $mainMod CTRL SHIFT, 3, movewindow, mon:desc:Samsung Electric Company SMS22A450

# Resize windows (direct) - use ALT instead of CTRL
binde = $mainMod ALT, H, resizeactive, -20 0
binde = $mainMod ALT, L, resizeactive, 20 0
binde = $mainMod ALT, K, resizeactive, 0 -20
binde = $mainMod ALT, J, resizeactive, 0 20

# Resize mode
bind = $mainMod, R, submap, resize
submap = resize
binde = , H, resizeactive, -20 0
binde = , L, resizeactive, 20 0
binde = , K, resizeactive, 0 -20
binde = , J, resizeactive, 0 20
binde = SHIFT, H, resizeactive, -80 0
binde = SHIFT, L, resizeactive, 80 0
binde = SHIFT, K, resizeactive, 0 -80
binde = SHIFT, J, resizeactive, 0 80
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
submap = reset

# Notifications
bind = $mainMod, N, exec, notification-menu
bind = $mainMod SHIFT, N, exec, package-menu
bind = $mainMod, BACKSPACE, exec, makoctl dismiss --all

# Media keys (with SwayOSD visual feedback on focused monitor)
# Caps/Num/Scroll Lock are handled by swayosd-libinput-backend systemd service
bindel = ,XF86AudioRaiseVolume, exec, swayosd-focused --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-focused --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-focused --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-focused --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-focused --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-focused --brightness lower

# Screenshot
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh

# Color picker - copies hex to clipboard
bind = $mainMod SHIFT, C, exec, hyprpicker -a

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

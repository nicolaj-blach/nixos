# Host-specific config (monitors, etc.) - created by NixOS if missing
source = ~/.config/hypr/local.conf

source = ~/.config/hypr/programs.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/input.conf

# Load split-monitor-workspaces plugin before binds
plugin = /run/current-system/sw/lib/libsplit-monitor-workspaces.so

# split-monitor-workspaces plugin config
plugin {
  split-monitor-workspaces {
    count = 9
    keep_focused = 0
    enable_notifications = 0
    enable_persistent_workspaces = 1
  }
}

source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/autostart.conf


monitor=HDMI-A-2,1920x1080@60.00,0x0,1.00
monitor=DP-2,3440x1440@60.00,1920x0,1.00
monitor=DP-3,1680x1050@59.95,5360x0,1.00,transform,1
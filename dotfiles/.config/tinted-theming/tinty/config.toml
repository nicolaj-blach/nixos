shell = "zsh -c '{}'"
default-scheme = "base16-onedark"

# Shell ANSI colors
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-shell"
themes-dir = "scripts"
hook = "source \"$TINTY_THEME_FILE_PATH\""
supported-systems = ["base16", "base24"]

# Ghostty
[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-ghostty"
themes-dir = "themes/ghostty"
hook = "cp -f \"$TINTY_THEME_FILE_PATH\" ~/.config/ghostty/colors"
supported-systems = ["base16", "base24"]

# fzf
[[items]]
path = "https://github.com/tinted-theming/tinted-fzf"
name = "tinted-fzf"
themes-dir = "sh"
hook = "source \"$TINTY_THEME_FILE_PATH\""
supported-systems = ["base16", "base24"]

# Hyprland colors.conf
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-hyprland"
themes-dir = "scripts"
hook = "~/.local/bin/tinty-hyprland-hook"
supported-systems = ["base16"]

# hyprlock colors
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-hyprlock"
themes-dir = "scripts"
hook = "~/.local/bin/tinty-hyprlock-hook"
supported-systems = ["base16"]

# AGS bar colors
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-ags"
themes-dir = "scripts"
hook = "~/.local/bin/tinty-ags-hook"
supported-systems = ["base16"]

# Mako notification colors
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-mako"
themes-dir = "scripts"
hook = "~/.local/bin/tinty-mako-hook"
supported-systems = ["base16"]

# Walker launcher theme
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-walker"
themes-dir = "scripts"
hook = "~/.local/bin/tinty-walker-hook"
supported-systems = ["base16"]

shell = "zsh -c '{}'"
default-scheme = "base16-onedark"

# Shell ANSI colors
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-shell"
themes-dir = "scripts"
hook = "source \"$TINTY_THEME_FILE_PATH\""
supported-systems = ["base16", "base24"]

# Kitty terminal colors (uses tinted-terminal repo which has themes for many terminals)
[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-kitty"
themes-dir = "themes/kitty"
hook = "cp -f \"$TINTY_THEME_FILE_PATH\" ~/.config/kitty/colors.conf && pkill -USR1 kitty || true"
supported-systems = ["base16", "base24"]

# fzf
[[items]]
path = "https://github.com/tinted-theming/tinted-fzf"
name = "tinted-fzf"
themes-dir = "sh"
hook = "source \"$TINTY_THEME_FILE_PATH\""
supported-systems = ["base16", "base24"]

# Hyprland colors.conf
[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-hyprland"
themes-dir = "scripts"
hook = "~/.local/bin/tinty-hyprland-hook"
supported-systems = ["base16"]

# hyprlock colors

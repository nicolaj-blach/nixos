# Kitty config - minimal, matching previous Ghostty setup

# Font
font_family JetBrainsMono Nerd Font
font_size 11

# No window decorations (Hyprland handles this)
hide_window_decorations yes

# Disable confirm on close
confirm_os_window_close 0

# Split navigation (vim-style, matching Ghostty)
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Split creation
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current

# Split close
map ctrl+shift+w close_window

# Split resize
map ctrl+alt+h resize_window narrower 3
map ctrl+alt+j resize_window shorter 3
map ctrl+alt+k resize_window taller 3
map ctrl+alt+l resize_window wider 3

# Tab navigation
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+t new_tab_with_cwd

# OneDark theme (base16)
foreground #abb2bf
background #282c34
selection_foreground #3e4451
selection_background #abb2bf
cursor #abb2bf

# Normal colors
color0 #282c34
color1 #e06c75
color2 #98c379
color3 #e5c07b
color4 #61afef
color5 #c678dd
color6 #56b6c2
color7 #abb2bf

# Bright colors
color8 #545862
color9 #e06c75
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #c8ccd4

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #abb2bf
active_tab_background #282c34
inactive_tab_foreground #545862
inactive_tab_background #353b45

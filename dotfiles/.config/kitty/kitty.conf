# Kitty config

# Font
font_family JetBrainsMono Nerd Font
font_size 11

# No window decorations (Hyprland handles this)
hide_window_decorations yes

# Disable confirm on close
confirm_os_window_close 0

# Split navigation (vim-style)
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Split creation (e = horizontal line, o = vertical line)
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+e launch --location=hsplit --cwd=current
map ctrl+shift+o launch --location=vsplit --cwd=current

# Enable splits layout
enabled_layouts splits

# Dim inactive splits
inactive_text_alpha 0.4

# Split close
map ctrl+shift+w close_window

# Split resize
map ctrl+alt+h resize_window narrower 3
map ctrl+alt+j resize_window shorter 3
map ctrl+alt+k resize_window taller 3
map ctrl+alt+l resize_window wider 3

# Tab navigation
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+t new_tab_with_cwd

# Tab bar style
tab_bar_style separator
tab_separator " │ "
active_tab_font_style normal
inactive_tab_font_style normal

# Colors managed by tinty (include generated theme file)
include colors.conf

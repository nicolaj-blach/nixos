# Starship prompt - uses ANSI colors to follow base16/tinty system theme

format = """
 $directory\
$git_branch\
$git_status\
$git_state\
$nix_shell\
$python\
$nodejs\
$rust\
$cmd_duration\
$fill\
$time\
$line_break\
$character"""

[character]
success_symbol = "[ >](bold green)"
error_symbol = "[ >](bold red)"
vimcmd_symbol = ' [\[N\] >](bold purple)'

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " ro"
read_only_style = "red"

[git_branch]
style = "purple"
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = ""

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'
modified = "!"
untracked = "?"
staged = "+"
deleted = "x"
renamed = "r"
conflicted = "c"
ahead = "^${count}"
behind = "v${count}"
diverged = "^${ahead_count}v${behind_count}"

[git_state]
style = "yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style)'

[nix_shell]
style = "cyan"
format = '[\[$name\]]($style) '
symbol = ""
impure_msg = ""
pure_msg = ""
unknown_msg = ""

[python]
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(($virtualenv) )]($style)'
symbol = "py "

[nodejs]
style = "green"
format = "[$symbol($version )]($style)"
symbol = "node "

[rust]
style = "red"
format = "[$symbol($version )]($style)"
symbol = "rs "

[cmd_duration]
style = "yellow"
format = "[$duration]($style) "
min_time = 2_000

[fill]
symbol = " "

[time]
disabled = false
style = "dimmed white"
format = '[\[$time\]]($style)'
time_format = "%H:%M"

[line_break]
disabled = false

continuation_prompt = "     "

